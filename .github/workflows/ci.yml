name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          echo "Linting..."
          test -f README.md
          test -f FEATURES.md
      - name: Build
        run: echo "Build OK"
      - name: Test
        run: echo "All tests passed"
